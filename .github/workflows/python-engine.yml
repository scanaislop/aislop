name: Packaged Python engine

on:
  pull_request:
    branches: [develop, main]
    paths:
      - '.github/workflows/python-engine.yml'
      - '.github/workflows/release.yml'
      - 'packaging/python/**'
      - 'tools/python/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    name: Pack, install, scan and fix (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { platform: darwin-x64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { platform: darwin-arm64, runner: macos-15, target: aarch64-apple-darwin }
          - { platform: win32-x64, runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { platform: win32-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    env:
      RUST_TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      AISLOP_NO_TELEMETRY: '1'
      AISLOP_NO_UPDATE_NOTIFIER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astral-sh/ruff
          ref: c91de8a012cb87efe279b762020a0d28dd75ddb5 # 0.17.5
          path: engine-src
          persist-credentials: false

      - name: Build locked fork
        working-directory: engine-src
        run: |
          git apply ../packaging/python/engine.patch
          rustup target add "$RUST_TARGET"
          cargo build --locked --release --target "$RUST_TARGET" -p ruff --bin ruff
          cmp LICENSE ../tools/python/LICENSE
          suffix=""
          if [[ "$PLATFORM" == win32-* ]]; then suffix=".exe"; fi
          dest="../tools/python/$PLATFORM"
          mkdir -p "$dest"
          cp "target/$RUST_TARGET/release/ruff$suffix" "$dest/aislop-python$suffix"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install the packed CLI and exercise Python
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = "$PLATFORM"
          pnpm install --frozen-lockfile
          pnpm build
          archive=$(npm pack --silent)
          npm install --prefix "$RUNNER_TEMP/installed" --ignore-scripts --no-audit --no-fund "./$archive"
          python packaging/python/test-installed.py "$RUNNER_TEMP/installed/node_modules/aislop/dist/cli.js"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: tools/python/${{ matrix.platform }}/aislop-python*
          if-no-files-found: error
