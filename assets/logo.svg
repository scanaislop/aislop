<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Code brackets and slash -->
  <g filter="url(#subtleGlow)">
    <!-- Left bracket < -->
    <path d="M 88 92 L 56 128 L 88 164" fill="none" stroke="url(#bracketGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Slash / -->
    <path d="M 114 172 L 142 84" fill="none" stroke="url(#bracketGrad)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Right bracket > -->
    <path d="M 168 92 L 200 128 L 168 164" fill="none" stroke="url(#bracketGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkles / Cleaning accents -->
  <!-- Top Right Sparkle -->
  <path d="M 198 48 Q 198 64 182 64 Q 198 64 198 80 Q 198 64 214 64 Q 198 64 198 48 Z" fill="url(#sparkleGrad)"/>
  
  <!-- Bottom Left Sparkle -->
  <path d="M 58 184 Q 58 196 46 196 Q 58 196 58 208 Q 58 196 70 196 Q 58 196 58 184 Z" fill="#34d399"/>
  
  <!-- Top Center Sparkle -->
  <path d="M 136 44 Q 136 50 130 50 Q 136 50 136 56 Q 136 50 142 50 Q 136 50 136 44 Z" fill="#38bdf8"/>
  
  <!-- Bottom Right Sparkle -->
  <path d="M 204 182 Q 204 190 196 190 Q 204 190 204 198 Q 204 190 212 190 Q 204 190 204 182 Z" fill="#67e8f9"/>
</svg>
