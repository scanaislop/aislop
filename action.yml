name: aislop — AI Code Quality Gate
description: Run the aislop quality gate on AI-assisted code (scan + fail CI below threshold from .aislop/config.yml).
author: scanaislop
branding:
  icon: shield
  color: green

inputs:
  directory:
    description: Directory to scan.
    required: false
    default: "."
  node-version:
    description: Node.js version to install before running aislop.
    required: false
    default: "24"
  format:
    description: Output format — "json" (default, CI-friendly) or "human".
    required: false
    default: "json"
  version:
    description: npm aislop CLI version to run, for example "0.18.0" or "latest". When empty, a release tag ref such as @v0.18.1, or a commit SHA ref, runs the matching CLI version, and any other ref such as @v1 runs the latest release.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run aislop ci
      shell: bash
      env:
        AISLOP_FORMAT: ${{ inputs.format }}
        AISLOP_VERSION_INPUT: ${{ inputs.version }}
        AISLOP_ACTION_REF: ${{ github.action_ref }}
        AISLOP_DIR: ${{ inputs.directory }}
      run: |
        scan_dir="$AISLOP_DIR"
        if [[ "$scan_dir" != /* ]]; then
          scan_dir="$GITHUB_WORKSPACE/$scan_dir"
        fi

        args=("ci" "$scan_dir")
        if [ "$AISLOP_FORMAT" = "human" ]; then
          args+=("--human")
        fi

        aislop_version="$(bash "$GITHUB_ACTION_PATH/action/resolve-version.sh" "$AISLOP_VERSION_INPUT" "$GITHUB_ACTION_PATH" "$AISLOP_ACTION_REF")"
        echo "Running aislop@${aislop_version}"

        npm_exec_dir="$(mktemp -d)"
        trap 'rm -rf "$npm_exec_dir"' EXIT
        cd "$npm_exec_dir"
        npm exec --yes --package "aislop@${aislop_version}" -- aislop "${args[@]}"
